<!DOCTYPE html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Bank · HappyDays轨道交通服务器</title>
		<meta name="description" content="HappyDays轨道交通服务器文档目录。">
		<link rel="icon" type="image/png" href="/icon.png?v=2">
		<script>
			(function () {
				try {
					var saved = localStorage.getItem("happydays-theme");
					if (saved === "dark" || saved === "light") {
						document.documentElement.setAttribute("data-theme", saved);
					}
				} catch (error) {
					/* 忽略隐私模式下的 localStorage 错误 */
				}
			})();
		</script>
		<link rel="stylesheet" href="/assets/home-base.css">
		<link rel="stylesheet" href="/assets/home.css">
		<link rel="stylesheet" href="/assets/bgm.css">
	</head>
	<body class="bank-page">

		<header class="site-header">
			<div class="container header-inner">
				<a href="/home" class="logo">HAPPY<span>DAYS</span>服务器</a>
				<nav>
					<ul class="nav-links">
						<li><a href="/home">首页</a></li>
						<li><a href="/bank/intro">简介</a></li>
						<li><a href="/bank/beginner">新手教程</a></li>
						<li><a href="/bank/advanced">进阶教程</a></li>
						<li><a href="/bank/rules">服务器规则</a></li>
						<li><a href="/bank/history">HAPPYDAYS历史</a></li>
						<li><a href="/bank/gallery">妙妙图集</a></li>
						<li><a href="/bank/rules">大地巡游</a></li>
						<li><a href="/bank/advanced">车/机祸启示录</a></li>
					</ul>
				</nav>
				<button class="home-theme-toggle js-theme-toggle" type="button" aria-label="切换到夜间模式" aria-pressed="false">
					<svg class="home-theme-icon icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12 2.8v2.1M12 19.1v2.1M4.5 4.5 6 6M18 18l1.5 1.5M2.8 12h2.1M19.1 12h2.1M4.5 19.5 6 18M18 6l1.5-1.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
					<svg class="home-theme-icon icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.2 14.2A8.1 8.1 0 0 1 9.8 3.8a8.1 8.1 0 1 0 10.4 10.4Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
				</button>
			</div>
		</header>

		<main class="container bank-main">
			<nav class="bank-breadcrumb" id="bankBreadcrumb" aria-label="目录路径"></nav>
			<header class="bank-header">
				<p class="bank-eyebrow">HappyDays Bank</p>
				<h1 id="bankTitle">目录</h1>
				<p id="bankDescription"></p>
			</header>
			<div id="bankSections"></div>
		</main>

		<footer class="site-footer">
			<div class="container footer-grid">
				<div>HAPPYDAYS非官方文档 · 版权所有</div>
				<div>Bank 模式 · <a href="/home">返回首页</a></div>
			</div>
		</footer>

		<div id="bgmMount"></div>

		<script src="/assets/data.js" defer></script>
		<script src="/assets/site-common.js" defer></script>
		<script src="/assets/bgm-player.js" defer></script>
		<script src="/assets/bank.js" defer></script>
