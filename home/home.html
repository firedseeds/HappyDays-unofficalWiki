<!DOCTYPE html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>HappyDays轨道交通服务器</title>
		<meta name="description" content="HappyDays轨道交通服务器：发展城市、轨道交通与铁路建设。">
		<link rel="icon" type="image/png" href="/icon.png?v=2">
		<link rel="canonical" href="http://114.55.99.2:8000/home">
		<script>
			(function () {
				try {
					var saved = localStorage.getItem("happydays-theme");
					if (saved === "dark" || saved === "light") {
						document.documentElement.setAttribute("data-theme", saved);
					}
				} catch (error) {
					/* 忽略隐私模式下的 localStorage 错误 */
				}
			})();
		</script>
		<link rel="stylesheet" href="/assets/home-base.css">
		<link rel="stylesheet" href="/assets/home.css">
		<link rel="stylesheet" href="/assets/bgm.css">
	</head>
	<body>

		<!-- 导航 -->
		<header class="site-header">
			<div class="container header-inner">
				<a href="/home" class="logo">HAPPY<span>DAYS</span>服务器</a>
				<nav>
					<ul class="nav-links">
						<li><a href="/home" class="active">首页</a></li>
						<li><a href="/wiki/#/doc/intro#single">简介</a></li>
						<li><a href="/wiki/#/doc/before-joining#single">新手教程</a></li>
						<li><a href="/wiki/#/doc/resource-world-nether#single">进阶教程</a></li>
						<li><a href="/wiki/#/doc/cheating-response#single">服务器规则</a></li>
						<li><a href="/wiki/#/doc/matopiraphai#single">HAPPYDAYS历史</a></li>
						<li><a href="/wiki/#/doc/gallery-1#single">妙妙图集</a></li>
						<li><a href="/wiki/#/doc/world-map#single">大地巡游</a></li>
						<li><a href="/wiki/#/doc/immersive-vehicles#single">车/机祸启示录</a></li>
					</ul>
				</nav>
				<button class="home-theme-toggle js-theme-toggle" type="button" aria-label="切换到夜间模式" aria-pressed="false">
					<span class="theme-toggle-text">夜间</span>
				</button>
			</div>
		</header>

		<!-- 通栏主视觉（点击跳转简介页） -->
		<section class="hero-section">
			<div class="hero-frame">
				<a class="hero" href="/wiki/#/doc/intro#single" aria-label="前往简介页">
					<div class="hero-media" aria-hidden="true">
						<img id="homeHeroImage" alt="" hidden>
						<span class="hero-placeholder" id="homeHeroPlaceholder">NO IMAGE</span>
					</div>
					<div class="hero-caption">
						<div class="container">
							<h1>HappyDays轨道交通服务器</h1>
							<p>发展城市 · 轨道交通 · 铁路建设</p>
						</div>
					</div>
				</a>
				<button class="hero-edit" id="homeImageEdit" type="button" aria-label="编辑首页图片" hidden>编辑图片</button>
			</div>
			<a class="wiki-switch" href="/wiki/">更喜欢wiki式的操作方式？跳转至传统页面</a>
		</section>

		<main class="container">

			<div id="homeTopicSections"></div>

			<!-- 在线地图 -->
			<section class="section">
				<div class="section-header">
					<h2 class="section-title">在线地图</h2>
				</div>
				<div class="map-entry">
					<a href="http://n3-22.yxsjmc.cn:20675" target="_blank" rel="noopener">点击进入在线地图 →</a>
				</div>
			</section>

		</main>

		<footer class="site-footer">
			<div class="container footer-grid">
				<div>HAPPYDAYS非官方文档 · 版权所有</div>
				<div>最后更新日期：2026-10-26</div>
			</div>
		</footer>

		<dialog class="home-image-dialog" id="homeImageDialog" aria-labelledby="homeImageDialogTitle">
			<form class="home-image-form" id="homeImageForm">
				<header class="home-image-head">
					<div>
						<p class="home-image-eyebrow">Home visual</p>
						<h2 id="homeImageDialogTitle">编辑首页图片</h2>
					</div>
					<button class="home-image-close" id="homeImageCancelX" type="button" aria-label="关闭">×</button>
				</header>
				<div class="home-image-body">
					<label class="home-image-field">
						<span>轮换间隔（秒）</span>
						<input id="homeImageInterval" type="number" min="3" max="3600" step="1" value="5" required>
					</label>
					<div class="home-image-list" id="homeImageList"></div>
					<fieldset class="home-image-upload">
						<legend>上传新图片</legend>
						<label class="home-image-field">
							<span>图片文件</span>
							<input id="homeImageFile" type="file" accept=".png,.jpg,.jpeg,image/png,image/jpeg">
							<small>仅支持 .png、.jpg、.jpeg，最大 20MB</small>
						</label>
						<div class="home-image-upload-row">
							<label class="home-image-field">
								<span>权重</span>
								<input id="homeImageUploadWeight" type="number" min="0.1" max="1000000" step="0.1" value="1" required>
							</label>
							<button class="home-image-secondary" id="homeImageUpload" type="button">上传图片</button>
						</div>
					</fieldset>
					<p class="home-image-status" id="homeImageStatus"></p>
				</div>
				<footer class="home-image-actions">
					<button class="home-image-secondary" id="homeImageCancel" type="button">取消</button>
					<button class="home-image-primary" id="homeImageSubmit" type="submit">保存</button>
				</footer>
			</form>
		</dialog>

		<div id="bgmMount"></div>

		<script src="/assets/data.js" defer></script>
		<script src="/assets/site-common.js" defer></script>
		<script src="/assets/bgm-player.js" defer></script>
		<script src="/assets/home.js" defer></script>
	</body>
</html>
